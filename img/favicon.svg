           C 335 110 295 95 250 95
           C 165 95 105 160 105 256
           C 105 352 165 417 250 417
           C 295 417 335 402 365 367
           L 322 322
           C 305 344 280 355 250 355
           C 198 355 167 312 167 256
           C 167 200 198 157 250 157
           C 280 157 305 168 322 190
           Z"
        fill="url(#cGrad)"
        filter="url(#glow)" />

  <!-- Lightning Energy Accent in Center -->
